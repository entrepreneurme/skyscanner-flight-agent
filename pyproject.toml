[project]
name = "skyscanner-flight-agent"
version = "0.1.0"
description = "Find cheapest Skyscanner flights using anywhere/anytime indicative search"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27.0",
  "pyyaml>=6.0.2",
  "rich>=13.9.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "pytest-httpx>=0.35.0"]

[project.scripts]
skyscanner-agent = "skyscanner_agent.cli:main"

[build-system]
requires = ["setuptools>=75.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
